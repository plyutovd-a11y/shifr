name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install python-pptx==1.0.2 lxml cryptography pytest
      - run: python -m pytest -q

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm --onefile --windowed --name shifr --exclude-module tkinter main.py
      - name: Smoke test
        shell: pwsh
        run: |
          $env:SHIFR_SMOKE = "1"
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process -FilePath dist\shifr.exe -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: shifr-windows
          path: dist/shifr.exe

  linux:
    needs: test
    runs-on: ubuntu-latest
    # Debian 11 (glibc 2.31): бинарник запускается на Alt p10 / Alt K 10.x (glibc 2.32)
    container: python:3.12-bullseye
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for Qt (будут вложены в бинарник)
        run: |
          # bullseye-security частично убран с зеркал — берём пакеты из основного репозитория
          sed -i '/security/d' /etc/apt/sources.list || true
          apt-get update
          apt-get install -y --no-install-recommends binutils libgl1 libegl1 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libxcb-xfixes0 libfontconfig1 libdbus-1-3
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm --onefile --windowed --name shifr --exclude-module tkinter main.py
      - name: Smoke test
        run: |
          SHIFR_SMOKE=1 QT_QPA_PLATFORM=offscreen ./dist/shifr
          pyi-archive_viewer --list --recursive dist/shifr | grep -iE "libxcb-cursor|libqxcb" || (echo "xcb не вложен" && exit 1)
      - uses: actions/upload-artifact@v4
        with:
          name: shifr-linux
          path: dist/shifr

  release:
    # каждый пуш в main публикует релиз v<версия из shifr/__init__.py> (существующий обновляется)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(cut -d'"' -f2 shifr/__init__.py)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: out
      - run: |
          mv out/shifr-windows/shifr.exe out/shifr.exe
          mv out/shifr-linux/shifr out/shifr-linux-x86_64
          chmod +x out/shifr-linux-x86_64
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Shifr ${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            out/shifr.exe
            out/shifr-linux-x86_64
